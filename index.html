<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HUSS</title>
<meta name="description" content="HUSS - a first-person parkour time-attack game. Run, slide, wall-run and grapple through courses and chase your best time.">
<meta name="theme-color" content="#0b1020">
<meta property="og:title" content="HUSS"><meta property="og:description" content="First-person parkour time-attack in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M14 12h9v16h18V12h9v40h-9V36H23v16h-9z' fill='%23ffb02e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--fg:#f2f5ff;--ac:#ffb02e;--cy:#22d3ee;--gn:#4ade80;--mut:#9aa6c4;--font:"Chakra Petch","Arial Narrow",system-ui,sans-serif}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;font-weight:700;text-shadow:0 2px 6px #000a;transition:opacity .3s}
body.inmenu #hud{opacity:0}
/* ---------- TIMER HUD ---------- */
#tm{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--font);text-shadow:none;--tc:#22d3ee;--tcg:rgba(34,211,238,.5)}
#tm.idle{--tc:#8fa0c8;--tcg:rgba(143,160,200,.3)}
#tm.ahead{--tc:#4ade80;--tcg:rgba(74,222,128,.5)}
#tm.behind{--tc:#ff6a5a;--tcg:rgba(255,106,90,.5)}
#tm.fin{--tc:#4ade80;--tcg:rgba(74,222,128,.65)}
#tm .tm-top{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#d5ddf3;white-space:nowrap;text-shadow:0 1px 4px #000c}
#tm .tm-lv{background:var(--ac);color:#0b1020;padding:2px 9px 2px 7px;transform:skewX(-14deg);letter-spacing:.14em;text-shadow:none}
#tm .tm-nm{max-width:46vw;overflow:hidden;text-overflow:ellipsis}
#tm .tm-rs{color:#ff8a7a;letter-spacing:.1em}
#tm .tm-wrap{filter:drop-shadow(0 0 12px var(--tcg)) drop-shadow(0 5px 10px rgba(0,0,0,.55));transition:filter .3s}
#tm .tm-box{padding:2px;background:linear-gradient(90deg,var(--tc),var(--ac));clip-path:polygon(17px 0,100% 0,calc(100% - 17px) 100%,0 100%)}
#tm .tm-in{position:relative;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);background:linear-gradient(180deg,rgba(18,27,54,.92),rgba(7,11,24,.9));padding:5px 34px 7px;display:flex;align-items:center;gap:18px}
#tm .tm-in::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);pointer-events:none}
#tm .tm-d{display:flex;align-items:baseline;justify-content:flex-end;min-width:150px;font-size:46px;font-weight:700;line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 14px var(--tcg)}
#tm .tm-d small{font-size:25px;color:var(--ac);margin-left:2px;min-width:1.9em;text-align:left;text-shadow:0 0 10px rgba(255,176,46,.45)}
#tm.idle .tm-d{color:#aeb9d6;text-shadow:none}
#tm.fin .tm-d{color:#c9ffd9}
#tm .tm-side{display:flex;flex-direction:column;gap:4px;padding-left:16px;border-left:2px solid rgba(255,255,255,.14)}
#tm .tm-side div{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
#tm .tm-side i{font-style:normal;font-size:9.5px;letter-spacing:.2em;color:var(--mut)}
#tm .tm-side b{font-variant-numeric:tabular-nums;font-size:14px;min-width:3.8em;text-align:right;color:#fff}
#tm .tm-side b.up{color:var(--gn)}
#tm .tm-side b.dn,#tm .tm-side b.ovr{color:#ff6a5a}
#tm .tm-rail{display:none;position:relative;width:min(340px,78vw);height:16px;margin-top:1px}
#tm .tm-rail::before{content:"";position:absolute;left:0;right:0;top:7px;height:3px;background:rgba(255,255,255,.16);transform:skewX(-30deg);box-shadow:0 1px 3px #0008}
#tm .tm-fill{position:absolute;left:0;top:7px;height:3px;width:0;background:linear-gradient(90deg,#22d3ee,var(--tc));box-shadow:0 0 10px var(--tc);transform:skewX(-30deg);transform-origin:left}
#tm .tm-mk{position:absolute;top:3px;left:0;width:10px;height:10px;margin-left:-5px;background:#fff;transform:rotate(45deg);box-shadow:0 0 8px var(--tc),0 0 18px var(--tc)}
#tm .tm-cp{position:absolute;top:3px;width:9px;height:9px;margin-left:-5px;transform:rotate(45deg);border:2px solid rgba(255,255,255,.45);background:#0b1020}
#tm .tm-cp.hit{background:var(--gn);border-color:#fff;box-shadow:0 0 10px var(--gn)}
#tm .tm-cp.nx{border-color:var(--ac);animation:tmNx 1s ease-in-out infinite}
#tm .tm-cp.end{width:11px;height:11px;top:2px;margin-left:-6px;border-color:var(--ac);background:rgba(255,176,46,.25)}
#tm .tm-st{font-size:11px;font-weight:700;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;height:14px;color:var(--ac);text-shadow:0 1px 4px #000c}
#tm.idle .tm-st{animation:tmBlink 1.1s ease-in-out infinite}
#tm .tm-ban{position:absolute;top:100%;left:50%;margin-top:2px;transform:translate(-50%,-10px);opacity:0;transition:opacity .25s,transform .4s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;display:flex;gap:14px;align-items:center;padding:6px 24px;background:rgba(9,14,30,.9);border-left:3px solid var(--bc,#22d3ee);border-right:3px solid var(--bc,#22d3ee);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#d5ddf3;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);text-shadow:none}
#tm .tm-ban.show{opacity:1;transform:translate(-50%,0)}
#tm .tm-ban b{font-variant-numeric:tabular-nums;font-size:16px;color:#fff}
#tm .tm-ban.cp{gap:12px;padding:8px 30px;background:linear-gradient(100deg,rgba(9,14,30,.94),color-mix(in srgb,var(--bc) 22%,rgba(9,14,30,.94)) 50%,rgba(9,14,30,.94));box-shadow:0 0 22px color-mix(in srgb,var(--bc) 55%,transparent);overflow:hidden;position:absolute}
#tm .tm-ban.cp.show{animation:bnIn .6s cubic-bezier(.2,1.5,.4,1) both}
#tm .tm-ban.cp::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:bnSh .9s .15s ease-out 1 both;pointer-events:none}
#tm .tm-ban .bn-t{font-style:normal;font-size:15px;font-weight:900;letter-spacing:.34em;color:#fff;text-shadow:0 0 8px var(--bc),0 0 20px var(--bc),0 0 34px var(--bc)}
#tm .tm-ban.cp{gap:8px;padding:0;background:none;border:0;box-shadow:none;clip-path:none;overflow:visible;font-size:10px;letter-spacing:.1em;text-shadow:0 1px 3px #000,0 0 6px #000c}
#tm .tm-ban.cp::after{display:none}
#tm .tm-ban.cp b{font-size:12px;text-shadow:0 1px 3px #000,0 0 6px #000c}
#tm .tm-ban.cp .bn-t{font-size:10px;letter-spacing:.24em;text-shadow:0 0 6px var(--bc),0 1px 3px #000}
#tm .tm-ban.cp .bn-n i{width:6px;height:6px;border-width:1px}
#tm .tm-ban .bn-d{font-size:26px;font-weight:900;letter-spacing:.02em;line-height:1;color:var(--bc);text-shadow:0 0 6px var(--bc),0 0 18px var(--bc),0 0 32px var(--bc),0 2px 3px #000;animation:dPop .55s cubic-bezier(.2,1.8,.4,1) both}
#tm .tm-ban .bn-d small{font-size:11px;font-weight:700;letter-spacing:.22em;margin-right:7px;vertical-align:middle}
#tm .tm-side b#tmD.up,#tm .tm-side b#tmD.dn{font-size:22px;font-weight:900;line-height:1;text-shadow:0 0 8px currentColor,0 0 18px currentColor}
#tm .tm-side b#tmD.pop{animation:dPop .5s cubic-bezier(.2,1.8,.4,1)}
#tm.cph .tm-wrap{animation:tmCp .7s ease-out}
@keyframes dPop{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes tmCp{0%{transform:scale(1)}25%{transform:scale(1.1);filter:drop-shadow(0 0 22px var(--tc)) drop-shadow(0 0 10px var(--tc))}100%{transform:scale(1)}}
#tm .tm-ban .bn-n{display:inline-flex;gap:4px;align-items:center}
#tm .tm-ban .bn-n i{width:9px;height:9px;transform:rotate(45deg);border:2px solid rgba(255,255,255,.4);background:transparent}
#tm .tm-ban .bn-n i.on{background:var(--bc);border-color:#fff;box-shadow:0 0 8px var(--bc)}
#tm .tm-ban .bn-n i.cur{animation:bnPip .7s ease-out both}
@keyframes bnIn{0%{opacity:0;transform:translate(-50%,-12px) scale(.6,.4);filter:brightness(2.4)}55%{opacity:1;transform:translate(-50%,3px) scale(1.08,1.06)}100%{opacity:1;transform:translate(-50%,0) scale(1);filter:none}}
@keyframes bnSh{to{left:130%}}
@keyframes bnPip{0%{transform:rotate(45deg) scale(2.2)}100%{transform:rotate(45deg) scale(1)}}
#tm.go .tm-wrap{animation:tmGo .55s cubic-bezier(.2,1.5,.4,1)}
#tm.fin .tm-wrap{animation:tmFin 1.4s ease-out}
@keyframes tmBlink{50%{opacity:.35}}
@keyframes tmNx{50%{box-shadow:0 0 12px var(--ac);transform:rotate(45deg) scale(1.3)}}
@keyframes tmGo{0%{transform:scale(1);filter:drop-shadow(0 0 0 #fff)}25%{transform:scale(1.13);filter:drop-shadow(0 0 26px #fff) drop-shadow(0 0 18px var(--tcg))}100%{transform:scale(1)}}
@keyframes tmFin{0%{transform:scale(1)}20%{transform:scale(1.16);filter:drop-shadow(0 0 30px #4ade80) drop-shadow(0 0 16px #4ade80)}100%{transform:scale(1)}}
@media(max-width:600px){#tm .tm-d{font-size:34px;min-width:112px}#tm .tm-d small{font-size:19px}#tm .tm-in{padding:4px 22px 6px;gap:12px}#tm .tm-side{padding-left:10px;gap:3px}#tm .tm-side b{font-size:12px}#tm .tm-nm{display:none}}
#lv{display:none}
#sp{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:18px;color:var(--ac)}
#msg{position:absolute;top:32%;width:100%;text-align:center;font-size:26px;opacity:0;transition:opacity .4s}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff;opacity:.7}
/* ---------- WALL CHAIN popup ---------- */
:root{--c:#4de1ff;--cg:#4de1ff8c}
#chain{position:absolute;left:50%;top:max(21%,196px);transform:translateX(-50%);width:440px;max-width:94vw;text-align:center;font-family:var(--font);opacity:0;transition:opacity .35s}
#chain.on{opacity:1}
#chain .ch-in{position:relative;display:inline-block;padding:0 22px}
#chain.max .ch-in{animation:chHue 1.2s linear infinite}
#chain .ch-in::before{content:"";position:absolute;left:-14%;right:-14%;top:38%;height:50%;transform:skewX(-28deg);background:linear-gradient(90deg,transparent,var(--cg),transparent);filter:blur(12px);z-index:-1}
#chain .ch-t{font-size:16px;letter-spacing:.6em;padding-left:.6em;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 0 10px var(--c),0 0 24px var(--c);margin-bottom:-6px}
#chain .ch-t::before,#chain .ch-t::after{content:"";display:inline-block;width:46px;height:2px;vertical-align:middle;margin:0 14px;background:linear-gradient(90deg,transparent,var(--c));box-shadow:0 0 8px var(--c)}
#chain .ch-t::after{transform:scaleX(-1)}
#chain .ch-n{font-size:98px;line-height:1.05;font-weight:700;font-style:italic;letter-spacing:-.02em;color:#fff;-webkit-text-stroke:2px var(--c);paint-order:stroke fill;text-shadow:0 0 16px var(--c),0 0 40px var(--c),0 0 80px var(--cg),0 5px 0 rgba(0,0,0,.4);transform-origin:50% 60%}
#chain .ch-r{position:absolute;left:50%;top:58%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 22px var(--c),inset 0 0 22px var(--c);opacity:0}
#chain .ch-p{display:flex;justify-content:center;gap:6px;margin-top:2px}
#chain .ch-p i{width:34px;height:8px;transform:skewX(-28deg);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);transition:background .15s,box-shadow .15s}
#chain .ch-p i.l{background:var(--c);border-color:#fff;box-shadow:0 0 10px var(--c),0 0 22px var(--cg)}
#chain .ch-b{height:4px;width:240px;margin:9px auto 0;background:rgba(255,255,255,.14);transform:skewX(-28deg);overflow:hidden}
#chain .ch-b b{display:block;height:100%;background:linear-gradient(90deg,var(--c),#fff);box-shadow:0 0 12px var(--c);transform-origin:left}
#chain.hit .ch-n{animation:chPop .55s cubic-bezier(.2,1.5,.4,1)}
#chain.hit .ch-t{animation:chT .5s ease-out}
#chain.hit .ch-r{animation:chRing .7s ease-out}
#chfx{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,var(--c) 140%);mix-blend-mode:screen}
#chfx.go{animation:chFx .5s ease-out}
@keyframes chPop{0%{transform:scale(2.5) rotate(-8deg);filter:blur(7px);opacity:0}35%{transform:scale(.86) rotate(2deg);filter:none;opacity:1}65%{transform:scale(1.09) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
@keyframes chT{0%{letter-spacing:1.5em;opacity:0}100%{letter-spacing:.6em;opacity:1}}
@keyframes chRing{0%{transform:scale(.3);opacity:.95}100%{transform:scale(3.6);opacity:0}}
@keyframes chHue{to{filter:hue-rotate(360deg)}}
@keyframes chFx{0%{opacity:.7}100%{opacity:0}}
@media(max-width:600px){#chain .ch-n{font-size:70px}#chain .ch-t{font-size:13px}#chain .ch-t::before,#chain .ch-t::after{width:22px;margin:0 8px}#chain .ch-p i{width:24px}}

#hud::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%);z-index:-1}
/* ---------- menu ---------- */
#menu{position:fixed;inset:0;display:flex;overflow-y:auto;box-sizing:border-box;font-family:var(--font);transition:opacity .3s;
 padding:max(28px,env(safe-area-inset-top)) max(32px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(32px,env(safe-area-inset-left));
 background:radial-gradient(130% 100% at 0% 55%,rgba(6,10,24,.95) 0%,rgba(6,10,24,.78) 40%,rgba(6,10,24,.34) 100%),
  linear-gradient(180deg,rgba(6,10,24,.5),transparent 25%,transparent 75%,rgba(6,10,24,.65))}
.mw{margin:auto;width:min(1180px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:clamp(28px,6vw,90px);align-items:center}
.hero{min-width:0}
.logo{margin:0;line-height:.84;font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
.logo span{display:block;white-space:nowrap;padding-left:.2em}
.l1{font-size:clamp(44px,8vw,108px);color:#fff;text-shadow:-.06em 0 0 rgba(34,211,238,.5),-.12em 0 0 rgba(34,211,238,.24),-.18em 0 0 rgba(34,211,238,.1)}
.l2{font-size:clamp(70px,13vw,176px);color:var(--ac);text-shadow:-.045em 0 0 rgba(255,176,46,.5),-.09em 0 0 rgba(255,176,46,.26),-.135em 0 0 rgba(255,176,46,.12)}
.tag{margin:24px 0 0;max-width:30em;font-size:18px;line-height:1.5;color:#cdd6f2}
.res{margin-top:22px}
#res:empty{display:none}
.res .big{font:700 italic clamp(44px,6vw,76px)/1 var(--font);font-variant-numeric:tabular-nums}
.res .sub{margin-top:6px;font-size:17px;color:var(--mut)}
.res .sub b{color:var(--fg);font-variant-numeric:tabular-nums}
.res .good{color:var(--gn)}
#bt{display:flex;flex-wrap:wrap;gap:18px;margin-top:28px}
.btn{position:relative;isolation:isolate;appearance:none;border:0;background:none;color:#1a1200;font:700 italic 22px/1 var(--font);letter-spacing:.02em;padding:17px 42px;cursor:pointer}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ac);transform:skewX(-14deg);border-radius:5px;box-shadow:0 8px 30px rgba(255,176,46,.35);transition:transform .15s,filter .15s}
.btn:hover::before{transform:skewX(-14deg) translateX(4px);filter:brightness(1.08)}
.btn:active::before{transform:skewX(-14deg) scale(.97)}
.btn.sec{color:var(--fg);font-size:18px;padding:17px 32px}
.btn.sec::before{background:rgba(255,255,255,.07);box-shadow:none;border:2px solid rgba(255,255,255,.28)}
.btn:focus-visible,.lane:focus-visible{outline:2px solid #fff;outline-offset:4px}
#keys{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin-top:34px;max-width:580px;font-size:14px;line-height:1.3;color:var(--mut)}
.kg{display:flex;align-items:center;gap:6px;min-width:0}
.kg span.t{margin-left:4px}
kbd{display:inline-block;min-width:26px;padding:3px 8px;box-sizing:border-box;text-align:center;font:600 13px/1.3 var(--font);color:#dfe6ff;background:linear-gradient(#2b3556,#1b2342);border:1px solid #3d4a77;border-bottom-width:3px;border-radius:6px}
.tip{margin:16px 0 0;max-width:34em;font-size:14px;line-height:1.5;color:var(--mut)}
#ln{position:relative;display:flex;flex-direction:column;gap:12px;max-height:min(78vh,780px);overflow-y:auto;overflow-x:hidden;padding:6px 16px 6px 44px;margin-left:-44px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.lane{position:relative;isolation:isolate;appearance:none;border:0;background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer;
 display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:16px 36px 16px 30px;transition:transform .2s cubic-bezier(.16,1,.3,1)}
.lane::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-14deg);border-radius:6px;background:rgba(14,20,44,.74);border:1px solid rgba(255,255,255,.12);transition:background .2s,border-color .2s}
.lane:hover{transform:translateX(-8px)}
.lane.on{transform:translateX(-22px);color:#1a1200}
.lane.on::before{background:linear-gradient(90deg,#ffc65e,#ff9a1f);border-color:#ffd98f;box-shadow:0 10px 36px rgba(255,150,30,.35)}
.lk{width:46px;height:46px;display:grid;place-items:center;border-radius:9px;border:1px solid rgba(255,255,255,.45);font:700 italic 24px/1 var(--font);color:#fff;text-shadow:0 1px 4px #000c,0 0 2px #000a}
.nm{display:block;font:700 italic 25px/1.1 var(--font)}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ch i{font:500 12px/1 var(--font);padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:#c9d3f0}
.lane.on .ch i{background:rgba(0,0,0,.14);color:#2a1c00}
.lt{font:700 italic 30px/1 var(--font);font-variant-numeric:tabular-nums;text-align:right;min-width:96px}
.lt.no{font-size:24px;color:#6b7799}
.lt small{display:block;margin-top:5px;font:500 11px/1 var(--font);font-style:normal;opacity:.7}
.lane.on .lt.no{color:#7a5410}
@keyframes slamA{from{opacity:0;transform:translateX(-90px);text-shadow:-.5em 0 0 rgba(34,211,238,.3),-1em 0 0 rgba(34,211,238,.15),-1.5em 0 0 rgba(34,211,238,.06)}}
@keyframes slamB{from{opacity:0;transform:translateX(-90px);text-shadow:-.5em 0 0 rgba(255,176,46,.35),-1em 0 0 rgba(255,176,46,.18),-1.5em 0 0 rgba(255,176,46,.08)}}
@keyframes inR{from{opacity:0;transform:translateX(90px)}}
#menu.in .l1{animation:slamA .6s cubic-bezier(.16,1,.3,1) both}
#menu.in .l2{animation:slamB .6s .08s cubic-bezier(.16,1,.3,1) both}
#menu.in #ln{animation:inR .6s .18s cubic-bezier(.16,1,.3,1) both}
@media (max-width:900px){.mw{grid-template-columns:1fr}#menu{align-items:flex-start}.lane.on{transform:translateX(-8px)}#keys{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#menu.in .l1,#menu.in .l2,#menu.in #ln{animation:none}.lane,.btn::before{transition:none}}

/* ---------- finish report: a bottom sheet over the finish-gate shot, nothing like the main menu ---------- */
#fin{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;overflow-y:auto;box-sizing:border-box;font-family:var(--font);color:var(--fg);opacity:0;transition:opacity .25s;pointer-events:none;
 --r1:#ffe08a;--r2:#ffa91f;--rg:rgba(255,176,46,.5);
